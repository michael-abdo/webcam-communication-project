version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: rtms-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rtms-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rtms-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - rtms-network
    profiles:
      - debug

networks:
  rtms-network:
    driver: bridge

volumes:
  redis-data: