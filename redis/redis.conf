# Redis Configuration for RTMS Event Router
# Optimized for pub/sub and persistence

# Network
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Persistence - RDB snapshots
save 900 1      # Save after 900 sec (15 min) if at least 1 key changed
save 300 10     # Save after 300 sec (5 min) if at least 10 keys changed
save 60 10000   # Save after 60 sec if at least 10000 keys changed
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename rtms-dump.rdb
dir /data

# Persistence - AOF (Append Only File)
appendonly yes
appendfilename "rtms-appendonly.aof"
appendfsync everysec  # Sync to disk every second
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Memory Management
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Pub/Sub Settings
# Increase pub/sub buffers for high-throughput
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Performance Tuning
hz 10
dynamic-hz yes

# Logging
loglevel notice
logfile ""
syslog-enabled no

# Clients
maxclients 10000

# Command renaming for security
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""

# Enable keyspace notifications for monitoring
notify-keyspace-events ""

# Modules (if needed in future)
# loadmodule /usr/lib/redis/modules/redistimeseries.so
# loadmodule /usr/lib/redis/modules/rejson.so