<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Reflection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .question {
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .question label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .confidence {
            margin-top: 10px;
        }
        .confidence label {
            font-weight: normal;
            font-size: 14px;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        button {
            background: #2196f3;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #1976d2;
        }
        .instructions {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <h1>Cognitive Reflection Test</h1>
    
    <div class="instructions">
        <p>Please answer the following questions. Take your time to think about each problem carefully.</p>
        <p>After each answer, indicate how confident you are in your response.</p>
    </div>

    <form id="crt-form">
        <!-- Question 1: Bat and Ball -->
        <div class="question">
            <label for="q1">A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball. How much does the ball cost?</label>
            <input type="number" id="q1" name="bat_ball_answer" step="0.01" min="0" required placeholder="Enter amount in dollars (e.g., 0.05)">
            
            <div class="confidence">
                <label>How confident are you?</label>
                <div class="radio-group">
                    <label><input type="radio" name="bat_ball_confidence" value="low" required> Not confident</label>
                    <label><input type="radio" name="bat_ball_confidence" value="medium" required> Somewhat confident</label>
                    <label><input type="radio" name="bat_ball_confidence" value="high" required> Very confident</label>
                </div>
            </div>
        </div>

        <!-- Question 2: Widget Production -->
        <div class="question">
            <label for="q2">If it takes 5 machines 5 minutes to make 5 widgets, how long would it take 100 machines to make 100 widgets?</label>
            <input type="number" id="q2" name="widget_answer" min="0" required placeholder="Enter time in minutes">
            
            <div class="confidence">
                <label>How confident are you?</label>
                <div class="radio-group">
                    <label><input type="radio" name="widget_confidence" value="low" required> Not confident</label>
                    <label><input type="radio" name="widget_confidence" value="medium" required> Somewhat confident</label>
                    <label><input type="radio" name="widget_confidence" value="high" required> Very confident</label>
                </div>
            </div>
        </div>

        <!-- Question 3: Lily Pad -->
        <div class="question">
            <label for="q3">In a lake, there is a patch of lily pads. Every day, the patch doubles in size. If it takes 48 days for the patch to cover the entire lake, how long would it take for the patch to cover half of the lake?</label>
            <input type="number" id="q3" name="lily_answer" min="0" required placeholder="Enter number of days">
            
            <div class="confidence">
                <label>How confident are you?</label>
                <div class="radio-group">
                    <label><input type="radio" name="lily_confidence" value="low" required> Not confident</label>
                    <label><input type="radio" name="lily_confidence" value="medium" required> Somewhat confident</label>
                    <label><input type="radio" name="lily_confidence" value="high" required> Very confident</label>
                </div>
            </div>
        </div>

        <button type="submit">Submit Answers</button>
    </form>

    <script>
        // Simple form handling
        document.getElementById('crt-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Collect responses
            const formData = new FormData(this);
            const responses = {
                bat_ball: {
                    answer: formData.get('bat_ball_answer'),
                    confidence: formData.get('bat_ball_confidence')
                },
                widget: {
                    answer: formData.get('widget_answer'),
                    confidence: formData.get('widget_confidence')
                },
                lily_pad: {
                    answer: formData.get('lily_answer'),
                    confidence: formData.get('lily_confidence')
                },
                timestamp: new Date().toISOString()
            };
            
            // Log for now (would send to server)
            console.log('CRT Responses:', responses);
            
            // Simple validation feedback
            alert('Thank you! Your responses have been recorded.');
            
            // In production, would send to server:
            // fetch('/api/quiz/crt/submit', {
            //     method: 'POST',
            //     headers: {'Content-Type': 'application/json'},
            //     body: JSON.stringify(responses)
            // });
        });
    </script>
</body>
</html>
