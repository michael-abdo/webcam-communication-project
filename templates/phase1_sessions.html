<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 1 Sessions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css" integrity="sha512-dZ3VIAtF5NCz7L+G2kZZgwyUr0vbJIUKGwEuITdSb9VInA36TObgGJE0E7E5Wdl66iRS0LlwM651c01qmPvQ0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(120deg, #2563eb, #7c3aed);
            color: white;
            padding: 24px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px 60px;
        }
        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px -15px rgba(15, 23, 42, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            margin-bottom: 20px;
        }
        .controls label {
            display: flex;
            flex-direction: column;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
        }
        .controls input {
            margin-top: 6px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5f5;
            font-size: 14px;
        }
        .controls button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .controls button:hover {
            background: #1d4ed8;
        }
        .layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px -15px rgba(15, 23, 42, 0.4);
            overflow: hidden;
        }
        .card h2 {
            margin: 0;
            padding: 16px 20px;
            font-size: 18px;
            border-bottom: 1px solid #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: #f8fafc;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.08em;
        }
        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }
        tbody tr {
            cursor: pointer;
        }
        tbody tr:hover, tbody tr.active {
            background: #eff6ff;
        }
        .detail {
            padding: 18px 20px;
        }
        .detail h3 {
            margin-top: 0;
            color: #1d4ed8;
        }
        .detail dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            row-gap: 8px;
            column-gap: 12px;
            font-size: 14px;
        }
        .detail dt {
            font-weight: 600;
            color: #475569;
        }
        .detail dd {
            margin: 0;
            color: #1f2937;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .pill.success {
            background: #dcfce7;
            color: #166534;
        }
        .pill.muted {
            background: #e2e8f0;
            color: #475569;
        }
        .chunk-list {
            margin-top: 18px;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            max-height: 320px;
            overflow-y: auto;
        }
        .chunk-item {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-bottom: 10px;
            background: #f8fafc;
        }
        .chunk-item:last-child {
            margin-bottom: 0;
        }
        .chunk-meta {
            font-size: 13px;
            color: #475569;
        }
        .empty-state {
            padding: 40px;
            text-align: center;
            color: #64748b;
        }
        .error-banner {
            padding: 12px 16px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Phase 1 Capture Sessions</h1>
        <p style="margin-top: 8px; opacity: 0.8;">Review recent facilitator captures, consent timestamps, and chunk manifests.</p>
    </header>
    <div class="container">
        <div class="controls">
            <label>
                Capture API Token
                <input type="password" id="apiTokenInput" placeholder="Enter facilitator token" autocomplete="off">
            </label>
            <label>
                Max Sessions
                <input type="number" id="limitInput" value="20" min="1" max="100">
            </label>
            <button id="refreshBtn">Refresh</button>
            <span id="statusMessage" style="font-size: 13px; color: #475569;"></span>
        </div>

        <div id="errorContainer"></div>

        <div class="layout">
            <div class="card">
                <h2>Recent Sessions</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Facilitator</th>
                                <th>Device</th>
                                <th>Consent</th>
                                <th>Participants</th>
                                <th>Chunks</th>
                                <th>Last Chunk</th>
                            </tr>
                        </thead>
                        <tbody id="sessionsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card" id="detailsCard">
                <h2>Session Details</h2>
                <div class="detail" id="sessionDetail">
                    <div class="empty-state">
                        Select a session to view consent, device readiness, and chunk manifest.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/phase1_sessions.js"></script>
</body>
</html>
